name: radar

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub kan dit uitstellen met enkele minuten
  workflow_dispatch:          # handmatig starten via het tabblad Actions
    inputs:
      mode:
        description: "run = normaal, diagnose = toont per bron wat er binnenkomt"
        type: choice
        options: [run, diagnose]
        default: run

permissions:
  contents: write             # nodig om state/seen.json terug te committen

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Radar draaien
        run: python radar.py ${{ github.event.inputs.mode == 'diagnose' && '--diagnose' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}

      - name: Staat bewaren
        run: |
          git config user.name "radar"
          git config user.email "radar@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "state" && git push)
