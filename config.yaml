# ---------------------------------------------------------------------------
# Filter: een vacature wordt gemeld als de TITEL minstens één 'include'-woord
# bevat en géén 'exclude'-woord. 'boost' = extra belangrijke melding (ster).
# Hele woorden, hoofdletterongevoelig ("java" matcht dus niet "javascript").
# ---------------------------------------------------------------------------
include:
  - java
  - spring
  - spring boot
  - software developer
  - software engineer
  - softwareontwikkelaar
  - developer
  - ontwikkelaar
  - backend
  - back-end
  - full stack
  - fullstack
  - full-stack
  - young graduate
  - starter
  - trainee
  - programmeur
  - analist programmeur
  - analyst programmer
  - software
  - application developer
  - applicatieontwikkelaar
  - développeur
  - web developer

exclude:
  - ervaren
  - experienced
  - medior
  - mid-level
  - confirmé
  - gevorderd
  - senior
  - sr
  - lead
  - architect
  - manager
  - principal
  - expert
  - head
  - freelance
  - stage
  - stagiair
  - intern
  - internship

boost:
  - junior
  - starter
  - young graduate
  - graduate
  - trainee
  - entry level
  - java
  - spring boot

# ---------------------------------------------------------------------------
# Tekstfilter: na de titelcheck wordt de vacaturepagina opgehaald en gelezen.
#  - "starters welkom" / "geen ervaring vereist" -> altijd door
#  - "3 jaar ervaring", "minimum 2 years of experience", "2-4 jaar" -> afgewezen als
#    het minimum hoger is dan max_years. Zinnen met "pluspunt", "is a plus",
#    "nice to have" tellen niet mee.
#  - Lukt ophalen niet (LinkedIn/Indeed blokkeren vaak bots)? Dan krijg je de melding
#    met "⚠ tekst niet gecontroleerd" (on_fetch_fail: notify) of niets (skip).
# ---------------------------------------------------------------------------
text_filter:
  enabled: true
  max_years: 1            # 0 = enkel starters; 1 = "1 jaar" mag nog; 2 = tot 2 jaar
  on_fetch_fail: notify   # notify | skip
  max_checks_per_run: 20
  reject_phrases:         # losse uitdrukkingen die bijna altijd "ervaren" betekenen
    - bewezen ervaring
    - proven experience
    - proven track record
    - uitgebreide ervaring
    - extensive experience
    - aantoonbare ervaring
    - expérience confirmée

# ---------------------------------------------------------------------------
# Bronnen
#   type: html -> haalt de pagina op en pakt alle links die aan link_regex voldoen
#   type: mail -> leest alert-mails uit je Gmail (IMAP) van de afzender
# Twijfel je over link_regex? Draai:  python radar.py --probe <url>
# Geeft een bron "0 links", dan werkt de pagina met JavaScript of blokkeert ze bots.
# Zet dan enabled: false en gebruik de e-mailalert van die site.
# ---------------------------------------------------------------------------
sources:
  # --- Rechtstreeks (publieke zoekpagina's, geen login) --------------------
  # De VDAB-zoekpagina gaf 0 links (lijst wordt met JavaScript geladen): uitgezet.
  # Gebruik de VDAB-mailalert hieronder.
  - name: VDAB
    type: html
    enabled: false
    url: "https://www.vdab.be/vindeenjob/vacatures?trefwoord=java&sort=standaard"
    link_regex: "/vindeenjob/vacatures/\\d+"

  - name: VDAB junior
    type: html
    enabled: false
    url: "https://www.vdab.be/vindeenjob/vacatures?trefwoord=junior%20developer&sort=standaard"
    link_regex: "/vindeenjob/vacatures/\\d+"

  # ICTjob / Jobat: link_regex nog niet getest. Stappen:
  #   1) python radar.py --probe "<zoekpagina-url met jouw zoekterm>"
  #   2) kies het patroon dat alle vacature-links gemeen hebben
  #   3) zet enabled: true
  - name: ICTjob
    type: html
    enabled: false
    url: "https://www.ictjob.be/nl/it-vacatures-zoeken?keywords=java"
    link_regex: "ictjob\\.be/.*(vacature|job)/.+"

  - name: Jobat
    type: html
    enabled: false
    url: "https://www.jobat.be/nl/jobs?keywords=java"
    link_regex: "jobat\\.be/nl/jobs/.+"

  # --- Via e-mailalerts (LinkedIn, Indeed e.d. laten scrapen niet toe) -------
  # Maak op elke site een alert en laat die naar je Gmail sturen.
  # Pas link_regex aan met:  python radar.py --probe-mail linkedin.com
  - name: LinkedIn (mail)
    type: mail
    from_contains: "linkedin.com"
    link_regex: "linkedin\\.com/(comm/)?jobs/view/\\d+"

  - name: Indeed (mail)
    type: mail
    from_contains: "indeed.com"
    link_regex: "indeed\\.com/(rc/clk|viewjob)"
    keep_params: ["jk"]       # bij Indeed zit het vacature-id in ?jk=...

  - name: ICTjob (mail)
    type: mail
    from_contains: "ictjob"
    link_regex: "ictjob\\.be/"

  - name: Jobat (mail)
    type: mail
    from_contains: "jobat"
    link_regex: "jobat\\.be/"

  - name: VDAB (mail)
    type: mail
    from_contains: "vdab.be"
    link_regex: "vdab\\.be/vindeenjob/vacatures/\\d+"
